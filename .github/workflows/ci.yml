name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      # Self-hosted runners: put the SDK under the runner account's home, which it can always write,
      # never in the system install (which it cannot). Workloads install there too, without root.
      - name: Choose where setup-dotnet installs
        if: runner.environment == 'self-hosted'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"
      # Install the SDK in the job instead of trusting the runner's: every build then bundles the
      # current runtime whichever runner picked it up.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: Directory.Packages.props
      - name: Build (Release)
        # The self-hosted runner is RAM-capped (8 GB — see the github-actions-runner-infra
        # note); plain Release build is fine, but keep an eye on parallelism if heavier
        # waves (R2R, the interop host) push memory.
        run: dotnet build -c Release
      - name: Test
        run: dotnet test -c Release --no-build --filter "Category!=Interop"

  package:
    # Builds the amd64 .deb exactly as a release does. scripts/build-deb.sh reads the packaged
    # pdn-app.yaml back and fails unless its version matches the build version, so this keeps the
    # packaging and that check proven on every PR, not just on release day.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      # Self-hosted runners: put the SDK under the runner account's home, which it can always write,
      # never in the system install (which it cannot). Workloads install there too, without root.
      - name: Choose where setup-dotnet installs
        if: runner.environment == 'self-hosted'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"
      # Install the SDK in the job instead of trusting the runner's: every build then bundles the
      # current runtime whichever runner picked it up.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: Directory.Packages.props
      - name: Check the tools this job needs
        run: scripts/ci-require-tools.sh dpkg-deb:dpkg fakeroot:fakeroot xz:xz-utils tar
      - name: Build the amd64 .deb
        run: scripts/build-deb.sh linux-x64 "0.0.0+ci${{ github.run_number }}"

  interop:
    # The oracle lane: the conversd-saupp container (docker/compose.oracle.yml), built from the
    # vendored source, stands in as the upstream parent node. W0 proves it is reachable; later
    # waves drive the composed host against it (the diff-oracle discipline — design.md decision 10).
    runs-on: [self-hosted, Linux, X64]
    # The oracle binds a fixed host port (3600) and one compose project, and the self-hosted box
    # runs several runners — serialise.
    concurrency:
      group: pdnconvers-oracle-stack
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Self-hosted runners: put the SDK under the runner account's home, which it can always write,
      # never in the system install (which it cannot). Workloads install there too, without root.
      - name: Choose where setup-dotnet installs
        if: runner.environment == 'self-hosted'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"
      # Install the SDK in the job instead of trusting the runner's: every build then bundles the
      # current runtime whichever runner picked it up.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: Directory.Packages.props
      - name: Check the tools this job needs
        run: scripts/ci-require-tools.sh docker:docker.io
      - name: Oracle clean slate
        run: docker compose -f docker/compose.oracle.yml down -v --remove-orphans || true
      - name: Oracle up (healthcheck-gated)
        run: docker compose -f docker/compose.oracle.yml up -d --build --wait
      - name: Build (Release)
        run: dotnet build -c Release
      - name: Interop tests
        run: dotnet test -c Release --no-build --filter "Category=Interop"
      - name: Oracle logs on failure
        if: failure()
        run: |
          docker compose -f docker/compose.oracle.yml ps || true
          docker compose -f docker/compose.oracle.yml logs --tail 100 || true
      - name: Oracle down
        if: always()
        run: docker compose -f docker/compose.oracle.yml down -v --remove-orphans || true
